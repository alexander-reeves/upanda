site_name: UPanda
site_description: The package for rapid, differentiable sampling
site_author: Alexander Reeves
site_url: https://alexander-reeves.github.io/upanda/

repo_name: alexander.reeves/upanda
repo_url: https://github.com/alexander-reeves/upanda

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 80
            heading_level: 2
            show_bases: true
            show_inheritance_diagram: false
            members_order: source
            group_by_category: true
            show_category_heading: true
            show_if_no_docstring: true
            show_docstring_attributes: true
            show_docstring_functions: true
            show_docstring_classes: true
            show_docstring_modules: true
            show_docstring_description: true
            show_docstring_examples: true
            show_docstring_other_parameters: true
            show_docstring_parameters: true
            show_docstring_raises: true
            show_docstring_receives: true
            show_docstring_returns: true
            show_docstring_warns: true
            show_docstring_yields: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Data sources: data_sources.md
  - Validation: validation.md
  - Examples: examples.md
  - API Reference:
      - Likelihoods:
          - General LSS: api/likelihoods/general_lss.md
          - Planck 2018: api/likelihoods/planck_2018.md
          - ACT DR6: api/likelihoods/act_dr6.md
          - DESI BAO: api/likelihoods/desi_bao.md
          - Pantheon+: api/likelihoods/pantheon.md
      - Core Modules:
          - Run Panda: api/run_panda.md
          - Integrated Model: api/integrated_model.md
          - Provider: api/provider.md
          - Config: api/config.md
          - Utils: api/utils.md
  - Development:
      - Contributing: contributing.md
      - Authors: authors.md
      - History: history.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alexander-reeves/upanda
