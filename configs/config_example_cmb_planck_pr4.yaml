fixed_cosmology_parameters:

    - name: A_lens
      value: 1.0

    - name: fEDE
      value: 0.0

    - name: thetai_scf
      value: 2.0
  
    - name:  log10z_c
      value: 3.3

    - name: m_nu
      value: 0.02

    - name: cal143A
      value: 1.0

    - name: beta_radio
      value: -0.8

    #Polar efficiency parameters
    - name: pe100A
      value: 1.0

    - name: pe100B
      value: 1.0

    - name: pe143A
      value: 1.0

    - name: pe143B
      value: 1.0

    - name: pe217A
      value: 0.975

    - name: pe217B
      value: 0.975

variable_cosmology_parameters:

    - name: omega_cdm
      prior_min: 0.05
      prior_max: 0.255
      distribution: flat
      distribution_kwargs: {}

    - name: omega_b
      prior_min: 0.019
      prior_max: 0.026
      distribution: flat
      distribution_kwargs: {}

    - name: sigma8
      prior_min: 0.3
      prior_max: 1.3
      distribution: flat
      distribution_kwargs: {}

    - name: n_s
      prior_min: 0.84
      prior_max: 1.1
      distribution: flat
      distribution_kwargs: {}

    - name: h
      prior_min: 0.60
      prior_max: 0.82
      distribution: flat
      distribution_kwargs: {}

    - name: tau
      prior_min: 0.02
      prior_max: 0.08
      distribution: flat
      distribution_kwargs: {}

nuisance_parameters:
    - name: A_planck
      prior_min: 0.9
      prior_max: 1.1
      distribution: gaussian
      distribution_kwargs: {'cov':0.00000625, 'mu':1.0}


    - name: cal100A
      prior_min: 0.9
      prior_max: 1.1
      distribution: flat

    - name: cal100B
      prior_min: 0.9
      prior_max: 1.1
      distribution: flat

    # - name: cal143A
    #   value: 1.0
    #   distribution: flat

    - name: cal143B
      prior_min: 0.9
      prior_max: 1.1
      distribution: flat

    - name: cal217A
      prior_min: 0.9
      prior_max: 1.1
      distribution: flat

    - name: cal217B
      prior_min: 0.9
      prior_max: 1.1
      distribution: flat

    - name: Aradio
      prior_min: 0.0
      prior_max: 150.0
      distribution: flat

    # - name: beta_radio
    #   value: -0.8

    - name: Adusty
      prior_min: 0.0
      prior_max: 150.0

    # - name: beta_dusty
    #   value: "lambda beta_cib: beta_cib"

    - name: AdustT
      distribution: gaussian
      prior_min: 0.5
      prior_max: 1.5
      distribution: gaussian
      distribution_kwargs: {'cov':0.01, 'mu':1.0}

    - name: beta_dustT
      distribution: gaussian
      prior_min: 1.4
      prior_max: 1.6
      distribution_kwargs: {'cov':0.0001, 'mu':1.51}

    - name: AdustP
      distribution: gaussian
      prior_min: 0.7
      prior_max: 1.3
      distribution_kwargs: {'cov':0.01, 'mu':1.0}

    - name: beta_dustP
      distribution: gaussian
      prior_min: 1.5
      prior_max: 1.7
      distribution_kwargs: {'cov':0.0004, 'mu':1.59}

    - name: Acib
      prior_min: 0.0
      prior_max: 20.0

    - name: beta_cib
      distribution: gaussian
      prior_min: 1.6
      prior_max: 1.9
      distribution_kwargs: {'cov':0.0036, 'mu':1.75}

    - name: Atsz
      prior_min: 0.0
      prior_max: 50.0
      distribution: flat

    - name: Aksz
      prior_min: 0.0
      prior_max: 50.0
      distribution: flat

    - name: xi
      prior_min: -1.0
      prior_max: 1.0
      distribution: flat
