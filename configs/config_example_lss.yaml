fixed_cosmology_parameters:
    - name: m_nu
      value: 0.02

variable_cosmology_parameters:

    - name: omega_m
      prior_min: 0.1
      prior_max: 0.9
      distribution: flat
      distribution_kwargs: {}

    - name: omega_b
      prior_min: 0.01875
      prior_max: 0.02625
      distribution: flat
      distribution_kwargs: {}

    - name: sigma8
      prior_min: 0.3
      prior_max: 1.3
      distribution: flat
      distribution_kwargs: {}

    - name: n_s
      prior_min: 0.84
      prior_max: 1.1
      distribution: flat
      distribution_kwargs: {}

    - name: h
      prior_min: 0.60
      prior_max: 0.82
      distribution: flat
      distribution_kwargs: {}

    - name: bias_l1
      prior_min: 0.1
      prior_max: 5
      distribution: flat
      distribution_kwargs: {}

    - name: bias_c2
      prior_min: 0.1
      prior_max: 5
      distribution: flat
      distribution_kwargs: {}

    - name: del_z1
      prior_min: -0.05
      prior_max: 0.05
      distribution: flat
      distribution_kwargs: {}

    - name: del_z2
      prior_min: -0.05
      prior_max: 0.05
      distribution: flat
      distribution_kwargs: {}

    - name: del_z3
      prior_min: -0.05
      prior_max: 0.05
      distribution: flat
      distribution_kwargs: {}

    - name: del_z4
      prior_min: -0.05
      prior_max: 0.05
      distribution: flat
      distribution_kwargs: {}

    - name: del_z5
      prior_min: -0.05
      prior_max: 0.05
      distribution: flat
      distribution_kwargs: {}

    - name: A_IA
      prior_min: -6
      prior_max: 6
      distribution: flat
      distribution_kwargs: {}

