fixed_cosmology_parameters:
    - name: m_nu
      value: 0.02

    - name: A_lens
      value: 1.0

variable_cosmology_parameters:

    - name: omega_cdm
      prior_min: 0.08
      prior_max: 0.2
      distribution: flat
      distribution_kwargs: {}

    - name: omega_b
      prior_min: 0.01875
      prior_max: 0.02625
      distribution: flat
      distribution_kwargs: {}

    - name: sigma8
      prior_min: 0.3
      prior_max: 1.3
      distribution: flat
      distribution_kwargs: {}

    - name: n_s
      prior_min: 0.84
      prior_max: 1.1
      distribution: flat
      distribution_kwargs: {}

    - name: h
      prior_min: 0.40
      prior_max: 1.0
      distribution: flat
      distribution_kwargs: {}