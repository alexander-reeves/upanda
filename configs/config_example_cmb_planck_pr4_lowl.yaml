fixed_cosmology_parameters:
    - name: m_nu
      value: 0.02

    - name: A_lens
      value: 1.0


    - name: cal143A
      value: 1.0

    - name: beta_radio
      value: -0.8

    #Polar efficiency parameters
    - name: pe100A
      value: 1.0

    - name: pe100B
      value: 1.0

    - name: pe143A
      value: 1.0

    - name: pe143B
      value: 1.0

    - name: pe217A
      value: 0.975

    - name: pe217B
      value: 0.975


variable_cosmology_parameters:

    - name: omega_cdm
      prior_min: 0.08
      prior_max: 0.2
      distribution: flat
      distribution_kwargs: {}

    - name: omega_b
      prior_min: 0.01875
      prior_max: 0.02625
      distribution: flat
      distribution_kwargs: {}

    - name: sigma8
      prior_min: 0.3
      prior_max: 1.3
      distribution: flat
      distribution_kwargs: {}

    - name: n_s
      prior_min: 0.84
      prior_max: 1.1
      distribution: flat
      distribution_kwargs: {}

    - name: h
      prior_min: 0.60
      prior_max: 0.82
      distribution: flat
      distribution_kwargs: {}

    - name: tau
      prior_min: 0.02
      prior_max: 0.08
      distribution: flat
      distribution_kwargs: {}

nuisance_parameters:
    - name: A_planck
      prior_min: 0.9
      prior_max: 1.1
      distribution: gaussian
      distribution_kwargs: {'cov':0.00000625, 'mu':1.0}