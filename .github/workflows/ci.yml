name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  JAX_PLATFORMS: cpu
  JAX_ENABLE_X64: "true"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  TF_NUM_INTRAOP_THREADS: "1"
  TF_NUM_INTEROP_THREADS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: >-
          python -m pytest -m 'not reference' --cov=UPanda --cov-fail-under=60
          --cov-report=term-missing

  reference:
    runs-on: ubuntu-latest
    env:
      COBAYA_PACKAGES_PATH: ${{ github.workspace }}/cobaya_packages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest cobaya camb
      - run: >-
          python -m pip install
          'planck_2020_lollipop @ git+https://github.com/planck-npipe/lollipop.git@280a9c93d33bc6a058d6bf769ec82d9f7fdbd2b6'
          'pyactlike @ git+https://github.com/ACTCollaboration/pyactlike.git@1cac8c5d047bc2cad991890f2ebf1d8e3fb483b3'
      - name: Install cobaya's BAO, supernova and Planck 2018 data
        run: >-
          cobaya-install bao.desi_dr2.desi_bao_all bao.desi_2024_bao_all
          bao.sdss_dr16_baoplus_lrg bao.sdss_dr16_baoplus_qso bao.sdss_dr16_baoplus_elg
          sn.pantheonplus sn.union3 sn.desdovekie
          planck_2018_highl_plik.TTTEEE_lite_native planck_2018_lensing.CMBMarged
          -p "$COBAYA_PACKAGES_PATH"
      - run: python -m pytest -m reference tests/test_reference.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade build ruff twine
      - run: python -m ruff check src/UPanda tests scripts
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
